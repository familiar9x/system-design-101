
name: Sync upstream

on:
  schedule:
    - cron: '15 2 * * *'  # 09:15 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync "${{ github.repository }}" \
            --source "ByteByteGoHq/system-design-101" \
            --branch main
